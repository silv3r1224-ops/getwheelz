{# Login / sign-up pop-ups for visitors who are not signed in (header.js opens them). #}
<div class="login-modal" id="loginModal">
    <form action="{{ url_for('auth.login') }}" method="post" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h2>Welcome back</h2>
        <p>Sign in to manage your bookings and workshop activity.</p>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <div class="fw-btn-con">
            <button class="fw-btn" type="submit">Login</button>
        </div>
        <p>New to Getwheelz? <a data-signup="signupBtn">Sign Up</a></p>
        <p>or</p>
        <button class="ggl-btn" id="google-login-btn" type="button">Login with Google</button>
    </form>
</div>
<div class="signup-modal" id="signUpModal">
    <form action="{{ url_for('auth.signup') }}" method="post" class="signup-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h2>Create your account</h2>
        <p>Join as a customer, workshop owner, or mechanic.</p>
        <input type="text" name="name" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" minlength="8" placeholder="Password" required>
        <input type="password" name="confirm_password" minlength="8" placeholder="Confirm Password" required>
        <select name="role">
            <option value="customer">Customer</option>
            <option value="owner">Workshop Owner</option>
            <option value="mechanic">Mechanic</option>
        </select>
        <div class="fw-btn-con">
            <button class="fw-btn" type="submit">Sign Up</button>
        </div>
        <p>Already have an account? <a data-login="loginBtn">Login</a></p>
        <p>or</p>
        <button class="ggl-btn" id="google-signup-btn" type="button">Sign Up with Google</button>
    </form>
</div>
