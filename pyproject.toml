[project]
name = "mechconnect"
version = "0.1.0"
description = "MechConnect (Getwheelz) marketplace app"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F = pyflakes (real bugs), I = import sorting, UP = pyupgrade modernize,
# E9 = syntax-level errors. Full pycodestyle (E501 line length etc.) is too
# noisy for this legacy codebase and is intentionally not enabled.
select = ["F", "I", "UP", "E9"]
ignore = ["BLE001", "S110", "LOG015", "FLY002"]

